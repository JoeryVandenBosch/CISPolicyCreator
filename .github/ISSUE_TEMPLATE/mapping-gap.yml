name: Mapping gap
description: Track an unresolved, requires-input, manual, or not-applicable CIS Intune mapping
labels: ["mapping-gap"]
body:
  - type: input
    id: benchmark
    attributes:
      label: Benchmark/version
    validations:
      required: true
  - type: input
    id: recommendation
    attributes:
      label: Recommendation ID
    validations:
      required: true
  - type: dropdown
    id: assessment_method
    attributes:
      label: CIS assessment method
      options:
        - Automated
        - Manual
    validations:
      required: true
  - type: dropdown
    id: mapping_status
    attributes:
      label: Current mapping status
      options:
        - unresolved
        - requires-input
        - manual
        - not-applicable
        - mapped
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Intune/Graph evidence collected
      description: Do not paste copyrighted benchmark sections. Summarize the implementation evidence and include public Microsoft documentation references if available.
  - type: textarea
    id: notes
    attributes:
      label: Notes
