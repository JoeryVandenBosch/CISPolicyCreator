name: Validate repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install hash-pinned PDF dependency
        run: python -m pip install --require-hashes -r tools/requirements.txt

      - name: Complete repository validation
        shell: pwsh
        run: ./scripts/Test-CISRepository.ps1 -PythonPath python
