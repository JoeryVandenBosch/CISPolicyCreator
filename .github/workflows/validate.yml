name: Validate repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize hash-pinned runtime
        shell: pwsh
        run: ./scripts/Initialize-CISPolicyCreator.ps1 -EnvironmentPath .venv -IncludeGraph

      - name: Complete repository validation
        shell: pwsh
        run: ./scripts/Test-CISRepository.ps1 -PythonPath .venv/bin/python -RequireGraph
